# One-sentence thesis shown at the top of the site and PDF.
thesis: >
  I design, build, and test liquid rocket propulsion hardware. My work has moved from
  single components, to owning a subsystem that flew, to architecting a full cryogenic
  fluid system from a blank sheet.

# Shown under the thesis as a short framing paragraph.
intro: >
  This portfolio is organized as a timeline. Each project records the problem, the
  constraints, the reasoning behind the design decisions, and how the result was
  validated. The through line is a progression from component design, to subsystem
  ownership on a vehicle that flew, to full-system architecture on a cryogenic stand.

