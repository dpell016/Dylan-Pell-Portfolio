# One-sentence thesis shown at the top of the site and PDF.
thesis: >
  I design, build, and test liquid rocket propulsion hardware. My work has moved from
  single components, to owning the feed system on a vehicle that flew, to leading the
  architecture of a full cryogenic fluid system.

# Shown under the thesis as a short framing paragraph.
intro: >
  This portfolio is organized as a timeline. Each project records the problem, the
  constraints, the reasoning behind the design decisions, and how the result was
  validated. The through line is a progression in liquid propulsion, from component
  design, to owning the feed system on a vehicle that flew, to leading full-system
  architecture on a cryogenic stand. Alongside the hardware are the analysis tools I
  built for my teams to design against, and a professional R&D internship that applied
  the same discipline, defining what good enough means and proving it, to a sourcing
  decision rather than a rocket.

